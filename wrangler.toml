name = "nv-portafolio"
main = "worker.js"
compatibility_date = "2026-11-01"

# La clave NO va aquí. Se guarda como secreto:
#   npx wrangler secret put NVIDIA_API_KEY

# Límites compartidos entre instancias (Workers Rate Limiting)
[[ratelimits]]
name = "RL_IP"          # por IP
namespace_id = "1001"
simple = { limit = 24, period = 60 }

[[ratelimits]]
name = "RL_TODO"        # todas las consultas
namespace_id = "1002"
simple = { limit = 36, period = 60 }

# Tope diario: una tabla con la fecha y el total
#   npx wrangler d1 create nv-portafolio-uso
[[d1_databases]]
binding = "DB"
database_name = "nv-portafolio-uso"
database_id = "<id que entrega wrangler d1 create>"

# Opcional, verificación de navegador:
#   npx wrangler secret put TURNSTILE_SECRET
